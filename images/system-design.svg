<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bf8700"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="348" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <!-- Signal arrows -->
  <g stroke="#57606a" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M150 138 H213"/>
    <path d="M335 138 H398"/>
    <path d="M520 138 H618"/>
    <path d="M740 138 H775 V78 H808"/>
    <path d="M740 138 H775 V198 H808"/>
  </g>

  <!-- Power arrows -->
  <g stroke="#bf8700" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#p)">
    <path d="M570 270 V235 H460 V168"/>
    <path d="M570 270 V235 H680 V168"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="13" fill="#57606a" text-anchor="middle">
    <text x="182" y="126">Bluetooth</text>
    <text x="367" y="126">UART</text>
    <text x="569" y="126">PWM + direction</text>
  </g>
  <text x="578" y="256" font-size="13" fill="#9a6700">power</text>

  <!-- Boxes -->
  <g stroke-width="2">
    <rect x="30" y="110" width="120" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <rect x="215" y="110" width="120" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <rect x="400" y="110" width="120" height="56" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
    <rect x="620" y="110" width="120" height="56" rx="10" fill="#fbefff" stroke="#c297ff"/>
    <rect x="810" y="50" width="140" height="56" rx="10" fill="#fff1e5" stroke="#ffa657"/>
    <rect x="810" y="170" width="140" height="56" rx="10" fill="#fff1e5" stroke="#ffa657"/>
    <rect x="510" y="270" width="120" height="50" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  </g>

  <!-- Box text -->
  <g text-anchor="middle" fill="#1f2328" font-size="15" font-weight="600">
    <text x="90" y="134">Android Phone</text>
    <text x="275" y="134">HC-05</text>
    <text x="460" y="134">Arduino Nano</text>
    <text x="680" y="134">Motor Driver</text>
    <text x="880" y="74">Left Motors</text>
    <text x="880" y="194">Right Motors</text>
    <text x="570" y="292">Battery Pack</text>
  </g>
  <g text-anchor="middle" fill="#57606a" font-size="11.5">
    <text x="90" y="152">Bluetooth RC app</text>
    <text x="275" y="152">Bluetooth module</text>
    <text x="460" y="152">Microcontroller</text>
    <text x="680" y="152">H-bridge driver</text>
    <text x="880" y="92">2x N20 gear motors</text>
    <text x="880" y="212">2x N20 gear motors</text>
    <text x="570" y="309">Power supply</text>
  </g>
</svg>
